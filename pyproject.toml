[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entryprobe"
version = "0.1.0"
description = "Verify that a package's console_scripts entry points can actually start after install"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hao Li" }]
keywords = ["pypi", "packaging", "release", "python", "audit", "console-scripts", "entry-points"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
entryprobe = "entryprobe.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/entryprobe"

[tool.setuptools.packages.find]
where = ["src"]
